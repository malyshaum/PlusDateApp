site_name: "PlusDateApp - Diploma Documentation"
site_description: "Diploma project documentation for PlusDateApp"
site_author: "Mikita Malyshau"

theme:
  name: material
  language: en
  palette:
    - scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  font:
    text: Roboto
    code: Roboto Mono
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.expand
    - navigation.top
    - navigation.indexes
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.tabs.link

plugins:
  - search

markdown_extensions:
  - tables
  - admonition
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - pymdownx.tasklist:
      custom_checkbox: true
  - pymdownx.tabbed:
      alternate_style: true
  - toc:
      permalink: true
      toc_depth: 3
      slugify: !!python/object/apply:pymdownx.slugs.slugify
        kwds:
          case: lower
  - attr_list
  - md_in_html

nav:
  - Home: index.md
  - Project Overview:
    - Overview: 01-project-overview/index.md
    - Problem & Goals: 01-project-overview/problem-and-goals.md
    - Stakeholders: 01-project-overview/stakeholders.md
    - Scope: 01-project-overview/scope.md
    - Features: 01-project-overview/features.md
  - Technical:
    - Architecture: 02-technical/index.md
    - Tech Stack: 02-technical/tech-stack.md
    - Deployment: 02-technical/deployment.md
    - Criteria:
      - Criteria Index: 02-technical/criteria/_template.md
      - Frontend Application: 02-technical/criteria/frontend.md
      - Backend API: 02-technical/criteria/backend-api.md
      - Database Design: 02-technical/criteria/database.md
      - Real-Time Communication: 02-technical/criteria/realtime.md
      - Authentication and Telegram: 02-technical/criteria/telegram-auth.md
      - Media Storage and Moderation: 02-technical/criteria/media-moderation.md
      - Containerization and Deployment: 02-technical/criteria/containerization-deployment.md
  - User Guide:
    - Getting Started: 03-user-guide/index.md
    - Features: 03-user-guide/features.md
    - FAQ: 03-user-guide/faq.md
  - Retrospective: 04-retrospective/index.md
  - Appendices:
    - Appendices Index: appendices/index.md
    - Glossary: appendices/glossary.md
    - API Reference: appendices/api-reference.md
    - Database Schema: appendices/db-schema.md

extra:
  social:
    - icon: fontawesome/brands/github
      link: "https://github.com/"
